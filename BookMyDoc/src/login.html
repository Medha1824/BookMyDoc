<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · BookMyDoc</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page">
      <!-- Navigation Bar -->
      <nav class="site-nav">
        <div class="logo">BookMyDoc</div>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#" class="nav-cta">Sign Up</a></li>
        </ul>
      </nav>

      <!-- Main -->
      <main class="container">
        <div class="form-container">
          <!-- Background Blobs -->
          <div class="form-blob">
            <svg
              class="blob-image blob-image--1"
              viewBox="0 0 200 200"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="currentColor"
                d="M45.3,-58.5C57.9,-49.4,66.4,-33.9,69.4,-17.5C72.4,-1.2,69.9,15.9,61.8,29.6C53.7,43.3,40,53.5,24.6,60.5C9.2,67.5,-7.9,71.2,-23.7,67.3C-39.4,63.4,-53.8,51.8,-62.1,37.1C-70.4,22.3,-72.6,4.4,-68.7,-11.5C-64.8,-27.4,-54.8,-41.4,-41.7,-50.6C-28.7,-59.8,-14.3,-64.2,1.7,-66.4C17.8,-68.6,35.6,-68.5,45.3,-58.5Z"
                transform="translate(100 100)"
              />
            </svg>
            <svg
              class="blob-image blob-image--2"
              viewBox="0 0 200 200"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="currentColor"
                d="M45.3,-58.5C57.9,-49.4,66.4,-33.9,69.4,-17.5C72.4,-1.2,69.9,15.9,61.8,29.6C53.7,43.3,40,53.5,24.6,60.5C9.2,67.5,-7.9,71.2,-23.7,67.3C-39.4,63.4,-53.8,51.8,-62.1,37.1C-70.4,22.3,-72.6,4.4,-68.7,-11.5C-64.8,-27.4,-54.8,-41.4,-41.7,-50.6C-28.7,-59.8,-14.3,-64.2,1.7,-66.4C17.8,-68.6,35.6,-68.5,45.3,-58.5Z"
                transform="translate(100 100)"
              />
            </svg>
            <svg
              class="blob-image blob-image--3"
              viewBox="0 0 200 200"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="currentColor"
                d="M45.3,-58.5C57.9,-49.4,66.4,-33.9,69.4,-17.5C72.4,-1.2,69.9,15.9,61.8,29.6C53.7,43.3,40,53.5,24.6,60.5C9.2,67.5,-7.9,71.2,-23.7,67.3C-39.4,63.4,-53.8,51.8,-62.1,37.1C-70.4,22.3,-72.6,4.4,-68.7,-11.5C-64.8,-27.4,-54.8,-41.4,-41.7,-50.6C-28.7,-59.8,-14.3,-64.2,1.7,-66.4C17.8,-68.6,35.6,-68.5,45.3,-58.5Z"
                transform="translate(100 100)"
              />
            </svg>
          </div>

          <!-- Header -->
          <div class="form-header">
            <p class="eyebrow">Please enter your details</p>
            <h1>Welcome back</h1>
            <p class="subtext">Sign in to manage your appointments.</p>
          </div>

          <!-- Form -->
          <form class="form-box">
            <!-- Email -->
            <div class="input-group">
              <input
                type="email"
                id="email"
                class="inputfield"
                placeholder=" "
                required
              />
              <label for="email" class="floating-label">Email address*</label>
            </div>

            <!-- Password -->
            <div class="input-group">
              <input
                type="password"
                id="password"
                class="inputfield"
                placeholder=" "
                required
              />
              <label for="password" class="floating-label">Password*</label>
              <button type="button" class="eye-icon" aria-label="Show password">
                <svg
                  class="eye-open"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                <svg
                  class="eye-closed"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  style="display: none"
                >
                  <path
                    d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M6.5 6.7C3.9 8.4 2 12 2 12s4 7 11 7c1.9 0 3.6-.5 5.1-1.3M9.9 5.2A10.6 10.6 0 0 1 12 5c7 0 11 7 11 7a13.4 13.4 0 0 1-2.9 3.6"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>

            <!-- Remember Me -->
            <div class="checkbox-group">
              <div class="form-col remember-me">
                <input
                  type="checkbox"
                  id="remember-me-checkbox"
                  class="checkbox-field"
                />
                <label for="remember-me-checkbox">Remember me</label>
              </div>
              <div class="form-col">
                <a href="#" class="form-link">Forgot password?</a>
              </div>
            </div>

            <button type="submit" class="form-btn form-btn--submit">
              Sign In
            </button>
          </form>

          <!-- Divider -->
          <div class="form-divider">
            <span></span>
            <p>Or continue with</p>
            <span></span>
          </div>

          <!-- Social Login -->
          <div class="form-bottom">
            <div class="form-socials">
              <button
                type="button"
                class="form-btn form-btn--social"
                aria-label="Continue with Google"
              >
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                >
                  <path
                    fill="#4285F4"
                    d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.3 21.3 7.3 24 12 24z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.4 6.5l4 3.1c.9-2.8 3.5-4.8 6.6-4.8z"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="form-btn form-btn--social"
                aria-label="Continue with Facebook"
              >
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                >
                  <path
                    fill="#1877F2"
                    d="M24 12.1c0-6.6-5.4-12-12-12S0 5.5 0 12.1C0 18 4.4 22.9 10.1 23.8v-8.3H7.1v-3.4h3v-2.6c0-3 1.8-4.6 4.5-4.6 1.3 0 2.6.2 2.6.2v2.9h-1.5c-1.5 0-1.9.9-1.9 1.8v2.3h3.3l-.5 3.4h-2.8v8.3C19.6 22.9 24 18 24 12.1z"
                  />
                </svg>
              </button>

              <button
                type="button"
                class="form-btn form-btn--social"
                aria-label="Continue with Apple"
              >
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                >
                  <path
                    fill="#243530"
                    d="M16.4 1.4c0 1.1-.4 2.1-1.1 2.9-.8.9-2 1.6-3.2 1.5-.1-1.1.4-2.2 1.1-3 .8-.9 2.1-1.6 3.2-1.4zm3.1 17c-.6 1.3-.9 1.9-1.7 3-1.1 1.6-2.6 3.6-4.5 3.6-1.7 0-2.1-1.1-4.4-1.1-2.3 0-2.8 1.1-4.5 1.1-1.9 0-3.3-1.8-4.4-3.4C-2.2 17.9-.9 11.4 2.9 8.4c1.4-1.1 2.9-1.7 4.4-1.7 1.7 0 2.7 1.1 4.4 1.1 1.6 0 2.4-1.1 4.4-1.1 1.6 0 3.3.9 4.5 2.4-3.9 2.2-3.3 7.8.9 9.3z"
                  />
                </svg>
              </button>
            </div>

            <p class="signup-line">
              Don't have an account?
              <a href="#" class="form-link">Sign up</a>
            </p>
          </div>
        </div>
      </main>

      <footer>&copy; 2026 BookMyDoc. All rights reserved.</footer>
    </div>

    <script>
      const password = document.getElementById("password");
      const eyeIcon = document.querySelector(".eye-icon");
      const eyeOpen = document.querySelector(".eye-open");
      const eyeClosed = document.querySelector(".eye-closed");

      eyeIcon.addEventListener("click", () => {
        const isHidden = password.type === "password";
        password.type = isHidden ? "text" : "password";
        eyeOpen.style.display = isHidden ? "none" : "block";
        eyeClosed.style.display = isHidden ? "block" : "none";
        eyeIcon.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password",
        );
      });
    </script>
  </body>
</html>
